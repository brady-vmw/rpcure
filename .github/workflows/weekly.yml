name: Weekly update

on:
  schedule:
    - cron: "23 12 * * 5"   # Fridays 12:23 UTC = 5:23 AM Arizona
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["content/**", "templates/**", "static/**", "build.py", "fetcher.py", "CNAME"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      - name: Fetch data and build site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_NAME: ${{ vars.SITE_NAME || 'RP Cure Tracker' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python build.py            # content/design change: rebuild only
          else
            python build.py --fetch    # weekly run: pull fresh data, then build
          fi

      - name: Save this week's snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name "rp-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "Weekly data update $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
